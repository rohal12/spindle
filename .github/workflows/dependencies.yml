name: Dependencies

# GitHub's dependency graph reads package.json but not bun.lock: `submit`
# sends every package bun.lock installs (scripts/dependency-snapshot.ts), so
# Dependabot alerts cover dependencies of dependencies. On a pull request,
# `review` then fails when the change adds a package with a known
# vulnerability.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    # A pull request from a fork gets a token that cannot submit
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API needs it. Nothing is installed in this
      # job: the script runs with Node alone.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Submit the packages in bun.lock
        env:
          GH_TOKEN: ${{ github.token }}
          # A pull request's snapshot is of its head commit, which is what
          # dependency review compares
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/dependency-snapshot.ts |
            gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input -

  review:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The summary is a comment on the pull request when the review fails
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          # Waits for the snapshot `submit` sent to be processed
          retry-on-snapshot-warnings: true
