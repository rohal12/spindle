name: Version Preview

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Predict version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION=${LATEST_TAG#v}

          # As in release.yml: a breaking change is a minor bump while in 0.x
          BUMP="patch"
          if echo "$PR_TITLE" | grep -qE '^[a-z]+(\(.+\))?!: '; then
            BUMP="minor"
          elif echo "$PR_TITLE" | grep -qE '^feat(\(|:)'; then
            BUMP="minor"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case $BUMP in
            major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac

          {
            echo "current=${CURRENT_VERSION}"
            echo "next=${NEW_VERSION}"
            echo "bump=${BUMP}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
          BUMP: ${{ steps.version.outputs.bump }}
        with:
          script: |
            const { CURRENT, NEXT, BUMP } = process.env;
            const marker = '<!-- version-preview -->';
            const body = `${marker}\n**Release preview:** merging this PR will publish **v${NEXT}** (${BUMP} bump from v${CURRENT})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
