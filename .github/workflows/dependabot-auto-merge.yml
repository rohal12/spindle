name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's grouped minor/patch updates and its
# grouped security updates. GitHub then merges once the ruleset on main is
# satisfied: every required check and the code scanning results. Major
# updates, and anything outside those groups, stay manual.
#
# pull_request_target, because a Dependabot pull_request run only gets a
# read-only token. Nothing from the pull request is checked out or run:
# fetch-metadata reads its metadata through the API, and fills it only when
# the pull request holds nothing but verified Dependabot commits.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'rohal12/spindle'
    runs-on: ubuntu-latest
    permissions:
      # Enabling auto-merge needs both
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          contains(fromJSON('["bun-minor-and-patch", "actions-minor-and-patch", "bun-security", "actions-security"]'),
            steps.metadata.outputs.dependency-group)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
