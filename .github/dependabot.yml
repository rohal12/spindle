# Dependabot keeps every toolchain in this repository current: the Bun
# packages (package.json and bun.lock) and the actions the workflows use,
# which are pinned to commit SHAs.
#
# Minor and patch updates come as one grouped pull request per ecosystem,
# major updates one by one, and security updates grouped apart from both.
# A release must be a week old (two for a major Bun package; the actions
# ecosystem has no per-semver cooldown) before Dependabot proposes it;
# security updates are not delayed.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
      bun-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
